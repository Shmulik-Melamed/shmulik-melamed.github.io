  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(30,58,138,0.13);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 40px 32px 32px;
      text-align: center;
      color: white;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 16px;
      letter-spacing: 1px;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .title {
      font-size: 15px;
      opacity: 0.85;
      font-weight: 400;
    }

    .company {
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
      margin: 0 24px;
    }

    .links {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a.link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: transform 0.15s, box-shadow 0.15s;
      color: #1e3a8a;
      background: #f0f4ff;
      border: 1.5px solid #dbeafe;
    }

    a.link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(30,58,138,0.12);
      background: #e0eaff;
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-phone { background: #dcfce7; }
    .icon-email { background: #fef9c3; }
    .icon-whatsapp { background: #dcfce7; }

    .link-label {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .link-sub {
      font-size: 12px;
      color: #64748b;
      font-weight: 400;
      margin-top: 2px;
    }

    .save-btn {
      margin: 0 32px 28px;
      display: block;
      text-align: center;
      padding: 15px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }

    .save-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      padding: 0 32px 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
